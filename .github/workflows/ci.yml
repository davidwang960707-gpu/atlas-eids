name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  workspace:
    name: Build and test workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install dependencies
        run: npm ci

      - name: Build packages and examples
        run: npm run build

      - name: Run package tests
        run: npm test

      - name: Verify component API and release metadata
        run: npm run test:api-contract && npm run test:release

      - name: Build React and Vue Storybook
        run: npm run build:storybook

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test Storybook interactions and accessibility
        run: npm run test:storybook

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Run accessibility tests
        run: npm run test:a11y

      - name: Generate React and Vue projects
        run: |
          node packages/cli/dist/cli.mjs create atlas-ci-react --framework react --template agent-task --framework-layout tenant --density compact --locale en-US --adapter antd --backend java --local
          node packages/cli/dist/cli.mjs create atlas-ci-vue --framework vue --template data-list --framework-layout hybrid --density comfortable --locale zh-CN --adapter tdesign --backend none --local
          node packages/cli/dist/cli.mjs upgrade atlas-ci-react --dry-run

      - name: Install generated React project
        run: npm install
        working-directory: atlas-ci-react

      - name: Build generated React project
        run: npm run build
        working-directory: atlas-ci-react

      - name: Install generated Vue project
        run: npm install
        working-directory: atlas-ci-vue

      - name: Build generated Vue project
        run: npm run build
        working-directory: atlas-ci-vue

      - name: Test generated Java backend
        run: mvn --batch-mode test
        working-directory: atlas-ci-react/server

      - name: Test PostgreSQL and Keycloak integration
        run: mvn --batch-mode -Pintegration test
        working-directory: atlas-ci-react/server

      - name: Check production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual-regression:
    name: Visual regression on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages
        run: npm run build:packages

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Compare visual baselines
        run: npm run test:visual

      - name: Upload visual differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
